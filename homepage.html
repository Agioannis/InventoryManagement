<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Dashboard</title>
   <link rel="stylesheet" href="css/homepage.css">
   <script src="https://kit.fontawesome.com/b99e675b6e.js"></script>
   <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="wrapper">
   <div class="top_navbar">
      <div class="hamburger">
         <div class="hamburger__inner">
            <div></div>
            <div></div>
            <div></div>
         </div>
      </div>
      <div class="top_menu">
         <div class="logo">IMS</div>
         <div class="user_info">
            <img src="https://image.ibb.co/cbCMvA/logo.png" alt="profile_pic">
            <span>John Doe</span>
         </div>
      </div>
   </div>
   <div class="main_container">
      <div class="sidebar">
         <div class="sidebar__inner">
            <ul>
               <li>
                  <a href="#" class="active">
                     <span class="icon"><i class="fas fa-tachometer-alt"></i></span>
                     <span class="title">Dashboard</span>
                  </a>
               </li>
               <li>
                  <a href="#" class="dropdown-toggle">
                     <span class="icon"><i class="fas fa-file-alt"></i></span>
                     <span class="title">Reports</span>
                  </a>
               </li>
               <li>
                  <a href="Products.html" class="dropdown-toggle">
                     <span class="icon"><i class="fas fa-box-open"></i></span>
                     <span class="title">Products</span>
                  </a>
               </li>
               <li>
                  <a href="#" class="dropdown-toggle">
                     <span class="icon"><i class="fas fa-shipping-fast"></i></span>
                     <span class="title">Suppliers</span>
                  </a>
               </li>
               <li>
                  <a href="#" class="dropdown-toggle">
                     <span class="icon"><i class="fas fa-receipt"></i></span>
                     <span class="title">Purchase Orders</span>
                  </a>
               </li>
               <li>
                  <a href="#" class="dropdown-toggle">
                     <span class="icon"><i class="fas fa-user"></i></span>
                     <span class="title">User</span>
                  </a>
               </li>
            </ul>
         </div>
      </div>
      <div class="container">
         <div class="chart">
            <div class="pie_chart">
               <canvas id="myPieChart"></canvas>
               <p>Here is the breakdown of the purchase orders by status.</p>
            </div>
            <div class="bar_chart">
               <canvas id="myBarChart"></canvas>
               <p>Here is the breakdown of the purchase orders by status.</p>
            </div>
         </div>
         <div class="line_chart">
            <canvas id="myLineChart"></canvas>
            <p>Delivery History Per Day</p>
         </div>
      </div>
   </div>
</div>

<script src="homepage.js"></script>
</body>
</html>





<style>

</style>
    
   <script>
$(document).ready(function() {
   $(".hamburger").click(function() {
      $(this).toggleClass("active");
      $(".sidebar").toggleClass("active");
      $(".container").toggleClass("active");
   });

   $(".dropdown-toggle").click(function() {
      $(this).parent().find(".dropdown-menu").slideToggle("fast");
      $(this).find(".dropdown-arrow").toggleClass("rotate");
   });

   var ctxP = document.getElementById("myPieChart").getContext('2d');
   var myPieChart = new Chart(ctxP, {
      type: 'pie',
      data: {
         labels: ["Pending", "Complete", "Incomplete"],
         datasets: [{
            data: [0, 0, 3],
            backgroundColor: ["#FFCE56", "#36A2EB", "#FF6384"],
            hoverBackgroundColor: ["#FFCE56", "#36A2EB", "#FF6384"]
         }]
      },
      options: {
         responsive: true,
         legend: {
            position: 'bottom',
         }
      }
   });

   var ctxB = document.getElementById("myBarChart").getContext('2d');
   var myBarChart = new Chart(ctxB, {
      type: 'bar',
      data: {
         labels: ["Nestle", "Robinson"],
         datasets: [{
            label: "Suppliers",
            backgroundColor: ["#FF6384", "#36A2EB"],
            data: [2, 2]
         }]
      },
      options: {
         responsive: true,
         legend: {
            display: false,
         }
      }
   });

   var ctxL = document.getElementById("myLineChart").getContext('2d');
   var myLineChart = new Chart(ctxL, {
      type: 'line',
      data: {
         labels: ["2023-04-25", "2023-04-26", "2023-04-27", "2023-04-28"],
         datasets: [{
            label: "Product Delivered",
            data: [4, 6, 8, 10],
            backgroundColor: "rgba(75,192,192,0.4)",
            borderColor: "rgba(75,192,192,1)",
            borderWidth: 2
         }]
      },
      options: {
         responsive: true,
         legend: {
            position: 'bottom',
         }
      }
   });
});


   </script>
